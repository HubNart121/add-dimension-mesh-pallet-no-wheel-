<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Pallet Dimension Configurator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* สไตล์สำหรับกล่องข้อความที่วางทับบนรูปภาพ */
        .dimension-label {
            position: absolute;
            background-color: #ffffff; /* พื้นหลังสีขาวเพื่อบังตัวเลขเดิม */
            color: #0026ff; /* สีน้ำเงินให้ใกล้เคียงของเดิม */
            font-weight: 700;
            font-family: Arial, Helvetica, sans-serif;
            padding: 2px 6px; 
            border-radius: 4px;
            font-size: clamp(0.6rem, 1.4vw, 0.95rem); 
            white-space: nowrap;
            transform-origin: center;
            pointer-events: none; 
            box-shadow: 0 0 6px rgba(255,255,255,1); 
            line-height: 1.2;
        }

        /* กำหนดตำแหน่งและองศาการเอียงให้ตรงกับกึ่งกลางเส้นลูกศร */
        #label-a { top: 41%; left: 40%; transform: translate(-50%, -50%) rotate(12deg); }
        #label-b { top: 35%; left: 76%; transform: translate(-50%, -50%) rotate(-31deg); }
        #label-c { top: 33%; left: 52%; transform: translate(-50%, -50%); }
        #label-d { top: 48%; left: 93%; transform: translate(-50%, -50%); }
        #label-e { top: 77%; left: 28.5%; transform: translate(-50%, -50%); }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 flex flex-col md:flex-col lg:flex-row gap-8 w-full max-w-5xl items-center lg:items-start">
        
        <div id="export-container" class="w-full lg:w-2/3 max-w-3xl border rounded-lg overflow-hidden bg-white flex flex-col shadow-sm">
            
            <div class="p-4 md:p-6 border-b bg-gray-50 flex justify-between items-start">
                <div>
                    <h3 id="display-title" class="text-2xl md:text-3xl font-bold text-blue-800 break-words">หัวข้อ/ชื่อรุ่น</h3>
                    <p id="display-desc" class="text-gray-600 mt-2 break-words whitespace-pre-line">รายละเอียดสินค้า...</p>
                </div>
                <!-- ปุ่มอัปโหลดรูปภาพสำรองกรณีลิงก์เสีย -->
                <div class="hidden md:block">
                    <label class="cursor-pointer bg-blue-50 text-blue-600 px-3 py-1 rounded text-xs font-bold hover:bg-blue-100 transition-colors">
                        อัปโหลดรูปภาพ
                        <input type="file" id="image-upload" accept="image/*" class="hidden">
                    </label>
                </div>
            </div>

            <div class="relative w-full bg-white">
                <!-- อัปเดตลิงก์รูปภาพเป็นตัวใหม่ที่คุณต้องการ -->
                <img id="pallet-image" crossorigin="anonymous" src="https://img1.pic.in.th/images/mesh-pallet.png" alt="Mesh Pallet" class="w-full h-auto block"
                     onerror="this.src='https://placehold.co/1200x900/e2e8f0/64748b?text=Image+URL+Broken+Please+Upload'">
                
                <div id="label-a" class="dimension-label">? mm.</div>
                <div id="label-b" class="dimension-label">? mm.</div>
                <div id="label-c" class="dimension-label">? mm.</div>
                <div id="label-d" class="dimension-label">? mm.</div>
                <div id="label-e" class="dimension-label">? mm.</div>
            </div>
        </div>

        <div class="w-full lg:w-1/3 flex flex-col pt-4 lg:pt-0 pl-0 lg:pl-8">
            <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-6 text-center lg:text-left">ข้อมูลสินค้า</h2>

            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2 text-sm">หัวข้อ (Title) :</label>
                <input type="text" id="input-title" placeholder="เช่น Mesh Pallet รุ่น Standard" class="w-full p-2 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none transition-all text-gray-800">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2 text-sm">รายละเอียด (Description) :</label>
                <textarea id="input-desc" placeholder="เช่น รับน้ำหนักได้ 1,000 กก." rows="3" class="w-full p-2 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none transition-all resize-none text-gray-800"></textarea>
            </div>
            
            <hr class="mb-6 border-gray-200">
            <h3 class="text-lg font-bold text-gray-800 mb-4 text-center lg:text-left">ขนาด (Dimension)</h3>

            <div class="flex flex-col gap-4">
                <label class="flex items-center gap-3 bg-gray-50 p-2 rounded-lg border focus-within:border-blue-500 transition-all">
                    <span class="font-bold text-gray-700 w-6 text-center">A :</span>
                    <input type="number" id="input-a" placeholder="ระบุค่า" class="bg-transparent w-full outline-none text-gray-800 text-lg">
                    <span class="text-gray-500 font-medium pr-2">mm.</span>
                </label>
                <label class="flex items-center gap-3 bg-gray-50 p-2 rounded-lg border focus-within:border-blue-500 transition-all">
                    <span class="font-bold text-gray-700 w-6 text-center">B :</span>
                    <input type="number" id="input-b" placeholder="ระบุค่า" class="bg-transparent w-full outline-none text-gray-800 text-lg">
                    <span class="text-gray-500 font-medium pr-2">mm.</span>
                </label>
                <label class="flex items-center gap-3 bg-gray-50 p-2 rounded-lg border focus-within:border-blue-500 transition-all">
                    <span class="font-bold text-gray-700 w-6 text-center">C :</span>
                    <input type="number" id="input-c" placeholder="ระบุค่า" class="bg-transparent w-full outline-none text-gray-800 text-lg">
                    <span class="text-gray-500 font-medium pr-2">mm.</span>
                </label>
                <label class="flex items-center gap-3 bg-gray-50 p-2 rounded-lg border focus-within:border-blue-500 transition-all">
                    <span class="font-bold text-gray-700 w-6 text-center">D :</span>
                    <input type="number" id="input-d" placeholder="ระบุค่า" class="bg-transparent w-full outline-none text-gray-800 text-lg">
                    <span class="text-gray-500 font-medium pr-2">mm.</span>
                </label>
                <label class="flex items-center gap-3 bg-gray-50 p-2 rounded-lg border focus-within:border-blue-500 transition-all">
                    <span class="font-bold text-gray-700 w-6 text-center">E :</span>
                    <input type="number" id="input-e" placeholder="ระบุค่า" class="bg-transparent w-full outline-none text-gray-800 text-lg">
                    <span class="text-gray-500 font-medium pr-2">mm.</span>
                </label>
            </div>
            
            <button id="download-btn" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-all shadow-md active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                <span>ดาวน์โหลดเป็นรูปภาพ</span>
            </button>
        </div>
    </div>

    <script>
        const inputTitle = document.getElementById('input-title');
        const displayTitle = document.getElementById('display-title');
        const inputDesc = document.getElementById('input-desc');
        const displayDesc = document.getElementById('display-desc');
        const imageUpload = document.getElementById('image-upload');
        const palletImage = document.getElementById('pallet-image');

        // ฟังก์ชันอัปโหลดรูปภาพ
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => palletImage.src = event.target.result;
                reader.readAsDataURL(file);
            }
        });

        inputTitle.addEventListener('input', (e) => displayTitle.textContent = e.target.value || 'หัวข้อ/ชื่อรุ่น');
        inputDesc.addEventListener('input', (e) => displayDesc.textContent = e.target.value || 'รายละเอียดสินค้า...');

        ['a', 'b', 'c', 'd', 'e'].forEach(key => {
            const input = document.getElementById(`input-${key}`);
            const label = document.getElementById(`label-${key}`);
            input.addEventListener('input', (e) => {
                label.textContent = e.target.value ? `${e.target.value} mm.` : `? mm.`;
            });
        });

        const downloadBtn = document.getElementById('download-btn');
        downloadBtn.addEventListener('click', () => {
            const originalContent = downloadBtn.innerHTML;
            downloadBtn.innerHTML = `กำลังประมวลผล...`;
            downloadBtn.disabled = true;

            html2canvas(document.getElementById('export-container'), {
                useCORS: true,
                scale: 2,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                const link = document.createElement('a');
                const titleText = inputTitle.value || 'Mesh-Pallet';
                link.download = `${titleText.replace(/\s+/g, '-')}-spec.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).finally(() => {
                downloadBtn.innerHTML = originalContent;
                downloadBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
